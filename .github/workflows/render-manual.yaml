on:
  push:
    branches: main

name: render-manual.yaml
permissions: read-all

jobs:
  render-manual:
    if: "!contains(github.event.head_commit.message, '[skip render-manual]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, version: 'release'}
          - {os: macos-latest, version: 'release'}
          - {os: ubuntu-latest, version: 'release'}
    name: "${{ matrix.config.os }} (${{ matrix.config.version }})"
    runs-on: ${{ matrix.config.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Install system dependencies (macOS)

          brew install \
            gdal \
            proj \
            geos

          echo "PROJ_LIB=/opt/homebrew/share/proj" >> "${GITHUB_ENV}"
        shell: bash

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install system dependencies (Linux)

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            cmake \
            gdal-bin \
            gsfonts \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfribidi-dev \
            libgdal-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libmagick++-dev \
            libudunits2-dev \
            libx11-dev \
            pandoc
        shell: bash

      - name: Set up NetLogo
        uses: danielvartan/logoactions/setup-netlogo@v1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1 # default: 1

      - name: Render Quarto
        run: |
          # Render Quarto

          quarto render --profile html
        shell: bash

      - name: Deploy to GitHub Pages
        if: runner.os == 'Linux'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
